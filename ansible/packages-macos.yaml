---
# macOS packages. This is a task list, included from main.yaml when
# os_family == Darwin, so it must not contain play-level keys (hosts/roles/...).
- name: Install macOS Homebrew packages and casks
  ansible.builtin.include_role:
    name: geerlingguy.mac.homebrew
    apply:
      tags:
        - install
        - packages
        - homebrew
  vars:
    homebrew_installed_packages:
      - neovim
      - jq
      - tmux
      - ffmpeg
      - fzf
      - kubectx
      - nvm
      - pyenv
      - stern
      - tlrc
      - gnu-sed
      - bat
      - rustup
      - duti
      - bash
      - kustomize
      - lazygit
      - k9s
      - btop
      - ata
      - httpie
      - jira-cli
      - stow
      - git-delta
      - ruff
      - go
      - delve
      - parallel
      - bottom
      - goose
      - sst/tap/opencode
      - txn2/tap/kubefwd # port forword to kubernetes
      - gh # Github CLI
      - bun
      - uv
      - gogcli # Google Suite CLI (Gmail, Calendar, Drive, etc.)
      - qpdf # PDF decryption and transformation tool

      # yazi and its dependencies (ffmpeg, jq and fzf are listed above)
      - yazi
      - sevenzip # for archive extraction and preview
      - poppler # for PDF preview
      - fd # for file searching
      - ripgrep # for file content searching
      - zoxide # for historical directories navigation, requires fzf
      - resvg # for SVG preview
      - imagemagick # for Font, HEIC, and JPEG XL preview
      - font-symbols-only-nerd-font

      - p7zip
      - ocrmypdf
      - tuicr
      - rclone
      - herdr

    homebrew_cask_apps:
      - docker
      - firefox
      - google-chrome
      - chromedriver
      - mpv
      - slack
      - zoom
      - obs
      - postman
      - transmission
      - onlyoffice
      - zotero
      - whatsapp
      - font-meslo-lg-nerd-font
      - ghostty
      - zen
      - raycast
      - font-jetbrains-mono-nerd-font

      # Tiling window manager (config: configs/omniwm)
      - omniwm

      - notunes # Stops Music/iTunes from launching, need to add the login item in System Preferences
      - crmne/tap/spotifast # Spotify community
      - vorssaint

    homebrew_taps:
      - ankitpokhrel/jira-cli
      - oven-sh/bun
      - sst/tap
  tags:
    - install
    - packages
    - homebrew

- import_tasks: tasks/mpv.yaml

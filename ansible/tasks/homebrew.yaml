- name: Check if Homebrew is already installed
  stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: brew_installed
  tags:
    - install
    - homebrew

- name: Create Homebrew directory
  become: true
  file:
    path: /home/linuxbrew/.linuxbrew
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "0755"
  when: not brew_installed.stat.exists
  tags:
    - install
    - homebrew

- name: Install Homebrew
  become: false
  shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    executable: /bin/bash
  environment:
    NONINTERACTIVE: "1"
  when: not brew_installed.stat.exists
  tags:
    - install
    - homebrew

- name: Add Homebrew to bashrc
  become: false
  lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
    create: yes
  when: ansible_facts['os_family'] in ["Debian", "Archlinux"]
  tags:
    - install
    - homebrew

- name: Add Homebrew to fish config
  become: false
  lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/fish/config.fish"
    line: 'eval (/home/linuxbrew/.linuxbrew/bin/brew shellenv)'
    create: yes
  when: ansible_facts['os_family'] in ["Debian", "Archlinux"]
  tags:
    - install
    - homebrew

- name: Tap sst/tap for opencode
  become: false
  community.general.homebrew_tap:
    name: sst/tap
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  tags:
    - install
    - homebrew
    - packages

- name: Install Homebrew packages
  become: false
  community.general.homebrew:
    name:
      - bat
      - ffmpeg
      - fzf
      - git-delta
      - gogcli # Google Suite CLI (Gmail, Calendar, Drive, etc.)
      - herdr
      - lazygit
      - mpv
      - neovim
      - parallel
      - sst/tap/opencode
      - ripgrep
      - stow
      - tlrc
      - tmux
      - unzip
      - uv
      - wl-clipboard
      - yazi
      - zip
      - zsh
      - p7zip
      - tuicr
      - qpdf # PDF decryption and transformation tool
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  tags:
    - install
    - homebrew
    - packages

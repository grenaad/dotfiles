---
# noTunes (tasks/notunes.yaml) blocks Music. Vorssaint's Music app blocker only
# stops launches triggered by media keys, not the ones macOS makes when
# headphones connect, so keep it off and let noTunes handle every launch.
# Restart Vorssaint after a change so it picks the new values up.
- name: Turn off the Vorssaint Music app blocker
  community.general.osx_defaults:
    domain: com.vorssaint.utils
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: featureAvailable.musicBlock, type: bool, value: false }
    - { key: musicBlockEnabled, type: bool, value: false }
  loop_control:
    label: "{{ item.key }}"
  tags:
    - install
    - dotfiles
    - vorssaint

---
# Vorssaint's Music app blocker replaces noTunes. It only stops Music launches
# triggered by media keys (not headphones/Siri) and needs the Accessibility
# permission, which has to be granted by hand in System Settings.
# Restart Vorssaint after a change so it picks the new values up.
- name: Configure Vorssaint Music app blocker
  community.general.osx_defaults:
    domain: com.vorssaint.utils
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: featureAvailable.musicBlock, type: bool, value: true }
    - { key: musicBlockEnabled, type: bool, value: true }
    - { key: musicBlockReplacementPath, type: string, value: /Applications/Spotifast.app }
  loop_control:
    label: "{{ item.key }}"
  tags:
    - install
    - dotfiles
    - vorssaint

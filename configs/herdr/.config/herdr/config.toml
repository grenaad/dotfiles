# herdr — agent multiplexer. https://herdr.dev
# All options: herdr --default-config  |  https://herdr.dev/docs/config-reference/
# Apply edits to a running server: herdr server reload-config

# Skip the first-run setup flow (shown when this key is missing or true).
onboarding = false

[theme]
# Catppuccin Mocha 
name = "catppuccin"

[keys]
# Match the tmux prefix 
prefix = "ctrl+a"

# Tab switching
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# Pane navigation via the herdr-splits plugin
# plugin_action rather than focus_pane_* so the plugin can inspect the pane's
# foreground process and forward the chord to nvim, moving panes otherwise.
# focus_pane_* stays at its prefix+h/j/k/l defaults as an edge-case fallback.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (nvim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (nvim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (nvim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (nvim-aware)"

# Workspace picker 
[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "herdr-workspacer"
description = "workspace picker (project dirs)"
width = "80%"
height = "80%"

# Tab picker
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr-tabizer"
description = "tab picker (project dirs)"
width = "80%"
height = "80%"
